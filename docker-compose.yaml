# version: "3.9"

services:
   backend:
    build: .
    container_name: innodev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core/:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=test
      - DEBUG=True

networks:
  traefik_default:
    external: true
  take-report: 
    external: true